# All numeric assumptions for the SUMO track.
# Code must never hardcode these values; it reads them through sumo_track.config.
#
# Every entry has:
#   value   the number used by the code
#   unit    unit of the value
#   status  placeholder | assumed | literature | official | observed
#   source  where the value comes from (or "TBD – ..." if not yet known)
#   notes   anything else worth knowing
#
# Parameters are added here when the code that uses them is written.

step_length:
  value: 1
  unit: s
  status: assumed
  source: "Manuscript design decision: SUMO runs with --step-length 1"
  notes: "Fixed for the whole thesis. Not expected to change."

random_seed:
  value: 42
  unit: "-"
  status: assumed
  source: "Implementation choice"
  notes: "Default only. Each run may override it; the seed actually used is recorded in run_config.json."

boundary_buffer_m:
  value: 1000
  unit: m
  status: placeholder
  source: "Implementation choice (Plan Phase 1, step 2: placeholder around 500-1000 m)"
  notes: >-
    How far the clip polygon for the road network extends beyond the study boundary
    (python -m sumo_track.network.clip_polygon). Must keep roads and jeepney routes that
    cross the city line intact. Both field-observed jeepney traces (2026-10-14) lie fully
    inside the city, so they do not constrain it. Revisit with the Phase 1 verification
    report: many edges orphaned by the clip mean the buffer is too tight.

# --- Simulation ----------------------------------------------------------------------------

day_length_s:
  value: 86400
  unit: s
  status: assumed
  source: "Manuscript design decision: each simulated day is a separate 0-86400 s SUMO run"
  notes: "Jeepney flows run over the whole day."

# --- Jeepney routes (Phase 3) --------------------------------------------------------------

route_match_radius_m:
  value: 30
  unit: m
  status: assumed
  source: "Tuned 2026-10-17 on the two observed traces (python -m sumo_track.jeepney.route_match)"
  notes: >-
    Search radius for candidate road edges around each GPS point (sumolib mapTrace delta).
    20 m left up to 7 gaps per route; 50 m chose detours (matched route 1.17x the GPS length).
    30 m gave routes 0.91-1.00x the GPS length with 2 gaps each.

route_match_max_gap_m:
  value: 300
  unit: m
  status: assumed
  source: "Implementation choice"
  notes: >-
    Largest straight-line gap between two matched edges that is bridged with the shortest
    legal path. A larger gap stops the build: the trace and the network disagree too much to
    guess. Every bridged gap is listed in the matching report as a network fix to check.

# --- Vehicle types (Phase 3) ---------------------------------------------------------------

jeepney_vclass:
  value: bus
  unit: "-"
  status: assumed
  source: "Implementation choice; open group decision (Plan Part G)"
  notes: >-
    SUMO vehicle class, which decides the roads jeepneys may use. bus also allows bus-only
    lanes (1,793.9 km open vs 1,783.5 km for passenger). The sandbox used bus, the prototype
    passenger.

jeepney_capacity:
  value: 22
  unit: passengers
  status: placeholder
  source: "Lower bound: 22 passengers aboard observed 2026-10-14 (Jeepney_observed_stops_2026-10-14.csv, Balibago_to_Vista_Mall)"
  notes: "The full capacity has not been observed yet (field observation, Sec. 4.2.5)."

jeepney_length:
  value: 7.0
  unit: m
  status: placeholder
  source: "TBD - field observation; value from starosa_prototype and sandbox"
  notes: ""

jeepney_width:
  value: 2.1
  unit: m
  status: placeholder
  source: "TBD - field observation; value from sandbox 10/11"
  notes: ""

jeepney_max_speed:
  value: 16.67
  unit: m/s
  status: placeholder
  source: "TBD - assumption (Plan D.6); 60 km/h, as in the sandbox"
  notes: "Road speed limits still apply below this."

jeepney_accel:
  value: 1.0
  unit: m/s2
  status: placeholder
  source: "TBD - assumption (Plan D.6); value from starosa_prototype"
  notes: ""

jeepney_decel:
  value: 3.0
  unit: m/s2
  status: placeholder
  source: "TBD - assumption (Plan D.6); value from starosa_prototype"
  notes: ""

boarding_time_per_pax:
  value: 2.0
  unit: s
  status: placeholder
  source: "TBD - field observation / literature (Plan D.6); value from starosa_prototype"
  notes: "SUMO boardingDuration of the jeepney vType."

jeepney_lat_alignment:
  value: right
  unit: "-"
  status: assumed
  source: "sandbox/10_sublane (2026-10-01)"
  notes: "Keeps jeepneys on the kerb side of their lane, where they stop to load."

jeepney_headway:
  value: 300
  unit: s
  status: placeholder
  source: "TBD - field observation (Sec. 4.2.5)"
  notes: >-
    Time between jeepneys on each route. The plan's headway[route][period] is simplified to one
    value for every route and the whole day until headways are observed.

car_lat_alignment:
  value: nice
  unit: "-"
  status: assumed
  source: "sandbox/10_sublane (2026-10-01)"
  notes: >-
    Cars keep to the fewest strips when squeezing past. Sandbox 10: 5 of 25 overtakes went fully
    into the oncoming lane with nice, 15 of 23 with center. Other car dimensions are SUMO 1.27.0
    defaults for vClass passenger.

car_min_gap_lat:
  value: 0.4
  unit: m
  status: placeholder
  source: "TBD - assumption; value from sandbox 10/11"
  notes: "Sideways clearance a car keeps when passing."
