# Chooses the source for every input dataset.
# Code never uses these paths directly; it asks sumo_track.config for the active path.
#
#   active       placeholder | real | none
#   placeholder  stand-in file used until the final file is ready
#   real         final file (from the data team, or built by the SUMO track where provider says so)
#   provider     who owns the real dataset (manuscript section)
#
# Paths are relative to the sumo_track folder (sumo_track.config.REPO_ROOT). Files are created
# when the code that uses them is written.

study_boundary:
  active: real
  placeholder: data/placeholder/boundary.geojson
  real: ../population_extraction/boundaries/Santa_Rosa_City_Laguna.geojson
  provider: "Data team (Sec. 4.2.1): PSA/NAMRIA boundary via HDX COD-AB, in population_extraction/"
  notes: >-
    Exact polygon; the buffered clip polygon is derived from it
    (`python -m sumo_track.network.clip_polygon`).
    Real: the City of Santa Rosa polygon the data team used to select population cells
    (HDX COD-AB v03 from NAMRIA/PSA, PSGC 0403428000, valid_on 2025-02-13, 56.17 km2, CC BY-IGO).
    Read in place, not copied, so both tracks always use the same file. Its provenance and
    checksum are in Santa_Rosa_City_Laguna.metadata.json beside it, and the loader checks the
    checksum. City outline only; barangay polygons are still to come.
    Placeholder: OSM relation 1335521, built by `python -m sumo_track.network.boundary`.
    It wrongly includes about 36 km2 of Laguna de Bay (89.64 km2 in total).

osm_extract:
  active: placeholder
  placeholder: data/raw/santa_rosa_buffered.osm
  real: data/real/santarosa_clean.osm
  provider: "Sec. 4.2.4"
  notes: >-
    Placeholder: raw OSM data inside the buffered clip polygon, downloaded from Overpass by
    `python -m sumo_track.network.osm_download` and saved untouched, with a .provenance.json
    beside it (query, OSM data timestamp, checksum). Real: the data team's cleaned extract.

activity_locations:
  active: placeholder
  placeholder: data/placeholder/locations.csv
  real: data/real/locations.csv
  provider: "Sec. 4.2.3"
  notes: >-
    Placeholder: schools, workplaces, markets, malls and terminals extracted from the saved OSM
    data by `python -m sumo_track.locations.extract_pois` (rules in
    config/activity_categories.yaml), inside the exact study boundary, duplicates merged. A
    .provenance.json beside it lists the OSM timestamp, checksums, counts and every merge.
    Zone and road fields stay empty until zoning and snapping (Phase 2, steps 3-4).
    Real: the data team's activity location inventory (Sec. 4.2.3), in the same columns.

origin_zones:
  active: placeholder
  placeholder: data/placeholder/origin_zones.csv
  real: data/real/origin_zones.csv
  provider: "Sec. 4.2.2"
  notes: "Placeholder uses equal weights per residential edge."

jeepney_routes:
  active: real
  placeholder: data/placeholder/jeepney_routes.json
  real: "../Jeepney Routes/Jeepney_GPS_annotated_2026-10-14"
  provider: "Data team (Sec. 4.2.5): field observation by Matthew Fuentes, 2026-10-14"
  notes: >-
    A folder, read in place: one OsmAnd GPX track per observed jeepney trip
    (<trip>_..._annotated.gpx) and Jeepney_observed_stops_*.csv with each trip's stops,
    times and occupancy. Matched to the network by `python -m sumo_track.jeepney.route_match`.
    Partial: 2 one-way trips observed on one morning (Paseo -> Balibago, Balibago -> Vista
    Mall). Whether they are one line in two directions is to confirm with the data team.

traffic_counts:
  active: none
  placeholder: null
  real: data/real/traffic_counts.csv
  provider: "Sec. 4.2.6"
  notes: "No placeholder file; background demand uses randomTrips.py until counts arrive."
