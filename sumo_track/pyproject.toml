[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sumo-track"
version = "0.1.0"
description = "SUMO track (Manuscript Sec. 4.4) of the LLM-enhanced agent-based transportation simulation of Santa Rosa City, Laguna"
requires-python = ">=3.11"
# traci and sumolib are NOT listed here on purpose: they are loaded from
# $SUMO_HOME/tools (via PYTHONPATH) so they always match the installed SUMO version.
# Add dependencies here when the code that uses them is written.
dependencies = [
    "pyyaml>=6.0",
    "shapely>=2.0",   # polygons: study boundary, buffer, clipping
    "pyproj>=3.6",    # map projections: areas and distances in metres
    "rtree>=1.0",     # spatial index sumolib uses for map matching (minutes -> under a second)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
